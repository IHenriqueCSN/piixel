[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "piixelverso"
version = "0.1.0"
description = "Editor desktop de pixel art com contagem de peças e arquivos .pii"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6-Essentials>=6.8,<7"]

[project.optional-dependencies]
build = ["pyinstaller>=6,<7"]

[project.gui-scripts]
piixelverso = "piixelverso.app:main"

[tool.setuptools.packages.find]
include = ["piixelverso*"]
