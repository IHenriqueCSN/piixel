[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "piixelverso"
version = "0.1.0"
description = "Piixel: aplicativo modular do Piixelverso com Ateliê de pixel art"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6-Essentials>=6.8,<7", "PyNaCl>=1.6,<2"]

[project.optional-dependencies]
build = ["pyinstaller>=6,<7"]

[project.gui-scripts]
piixel = "piixelverso.startup:main"
piixelverso = "piixelverso.startup:main"

[tool.setuptools.packages.find]
include = ["piixelverso*"]

[tool.setuptools.package-data]
piixelverso = ["assets/brand/*.svg", "assets/brand/*.json", "assets/brand/*.ttf", "assets/brand/*.txt", "assets/brand/*.md"]
