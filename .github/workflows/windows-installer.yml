name: Instalador Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/windows-installer.yml'
      - 'installer/**'
      - 'scripts/build.py'
      - 'scripts/build_windows_installer.ps1'
      - 'scripts/windows_assets.py'
      - 'piixelverso/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'run_piixelverso.py'

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Compilar e verificar instalador
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Instalar dependências de desenvolvimento
        run: python -m pip install -r requirements-dev.txt
      - name: Verificar aplicativo e empacotamento
        run: python -m unittest discover -s tests -q
      - name: Gerar aplicativo e instalador
        shell: pwsh
        run: ./scripts/build_windows_installer.ps1 -PythonExecutable python
      - name: Testar instalação e desinstalação
        shell: pwsh
        run: ./scripts/test_windows_installer.ps1 -PythonExecutable python
      - name: Gerar checksum
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem dist/installer/Piixel-Setup-*-x64.exe)
          if ($installers.Count -ne 1) { throw 'Era esperado um único instalador.' }
          $installer = $installers[0]
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii -LiteralPath "$($installer.FullName).sha256"
      - name: Disponibilizar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Piixel-Windows-x64
          path: |
            dist/installer/Piixel-Setup-*-x64.exe
            dist/installer/*.sha256
          if-no-files-found: error
          retention-days: 90
      - name: Publicar GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "A tag $($env:GITHUB_REF_NAME) não corresponde à versão $version."
          }
          $assets = @(
            Get-ChildItem dist/installer/Piixel-Setup-*-x64.exe,
              dist/installer/Piixel-Setup-*-x64.exe.sha256 |
              ForEach-Object { $_.FullName }
          )
          if ($assets.Count -ne 2) { throw 'Era esperado o instalador e seu checksum.' }
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --latest `
            --title "Piixel $version" --generate-notes
